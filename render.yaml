services:
  - type: web
    name: erp-system
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    disk:
      name: erp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
